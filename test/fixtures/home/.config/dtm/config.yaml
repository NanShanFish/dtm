# Paths are absolute filesystem destinations. They may use ${home}, ${root},
# a value from this mapping, or a string from variables. The predefined home
# and root paths can be overridden here.
path:
  config_home: ${home}/.config
  local_bin: ${home}/.local/bin
  system_config: ${root}/etc/dtm

# Variables are ordinary strings used by interpolation and templates.
variables:
  example_name: dtm

config:
  pkgs_dir: ${home}/dot/pkgs
  backup_dir: ${home}/.local/backup
